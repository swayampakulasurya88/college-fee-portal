name: Keep the fee portal awake

# Render's free tier spins a service down after ~15 minutes without traffic,
# which makes the next visit take 30-60 seconds. This free GitHub Actions job
# pings the health endpoint every 10 minutes so the portal stays warm.
#
# Notes:
#  - Free for public repositories (this repo is public).
#  - GitHub disables scheduled workflows after ~60 days without repo activity;
#    push any commit (or run this manually) to re-enable it.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          curl -fsS --max-time 90 https://kiet-fee-portal.onrender.com/api/health
          echo
